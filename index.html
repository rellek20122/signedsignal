<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f3">
	<title>SignedSignal</title>
	<link rel="icon" type="image/png" href="./favicon.png?v=3">

	<style>
		:root {
			color-scheme: light;
			font-family: "Segoe UI", sans-serif;
			color: #192b26;
			background: #f4f6f3;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			--ink: #192b26;
			--muted: #61716b;
			--line: #d8e0da;
			--accent: #087e68;
			--surface: #fff;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			display: grid;
			grid-template-rows: auto 1fr auto;
		}

		a { color: inherit; }

		.site-header, .site-footer {
			background: var(--surface);
		}

		.site-header { border-bottom: 1px solid var(--line); }

		.header-inner, .footer-inner, .page-content {
			width: min(100% - 40px, 1080px);
			margin-inline: auto;
		}

		.header-inner {
			min-height: 68px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
		}

		.brand {
			color: var(--ink);
			font-size: 18px;
			font-weight: 700;
			text-decoration: none;
		}

		.site-nav { display: flex; gap: 24px; }

		.site-nav a {
			color: var(--muted);
			font-size: 14px;
			text-decoration: none;
		}

		.site-nav a:hover, .site-nav a:focus-visible { color: var(--accent); }

		main { padding-block: clamp(40px, 8vh, 88px); }

		.page-content { max-width: 760px; }

		.eyebrow {
			margin: 0 0 12px;
			color: var(--accent);
			font-size: 12px;
			font-weight: 700;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(32px, 6vw, 48px);
			line-height: 1.1;
		}

		.intro {
			max-width: 560px;
			margin: 16px 0 28px;
			color: var(--muted);
			font-size: 17px;
			line-height: 1.6;
		}

		.content-panel {
			min-height: 180px;
			padding: 24px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--surface);
		}

		.content-panel h2 { margin: 0 0 8px; font-size: 18px; }
		.content-panel p { margin: 0; color: var(--muted); line-height: 1.6; }

		.site-footer { border-top: 1px solid var(--line); }

		.footer-inner {
			width: min(100% - 40px, 1080px);
			min-height: 68px;
			margin-inline: auto;
			display: flex;
			align-items: center;
			color: var(--muted);
			font-size: 13px;
		}

		.license-icons {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			flex-shrink: 0;
		}

		.license-icons img {
			display: block;
			width: 16px;
			height: 16px;
			max-width: 16px;
			max-height: 16px;
			object-fit: contain;
			opacity: 0.65;
		}

		.footer-license {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 8px;
			font-size: 13px;
			line-height: 1.5;
		}


		@media (max-width: 520px) {
			.footer-inner {
				width: min(100% - 32px, 1080px);
				padding-block: 14px;
			}
		}


		@media (max-width: 520px) {
			.header-inner, .footer-inner, .page-content { width: min(100% - 32px, 1080px); }
			.header-inner { min-height: 60px; }
			.site-nav { gap: 14px; }
			.site-nav a { font-size: 13px; }
			.content-panel { padding: 20px; }
		}
	</style>
</head>
<body>
	<header class="site-header">
		<div class="header-inner">
			<a class="brand" href="#home">SignedSignal</a>
			<nav class="site-nav" aria-label="Main navigation">
				<a href="#home">Home</a>
				<a href="#content">Content</a>
			</nav>
		</div>
	</header>

	<main id="home">
		<div class="page-content">
			<p class="eyebrow">Starter page</p>
			<h1>Your page starts here.</h1>
			<p class="intro">A simple, responsive foundation for building out SignedSignal.</p>
			<section class="content-panel" id="content" aria-labelledby="content-title">
				<h2 id="content-title">Main content</h2>
				<p>Replace this section with the features and information your site needs.</p>
			</section>
		</div>
	</main>

	<footer class="site-footer">
		<div class="footer-inner">
			<div class="footer-license">
				<span>
					&copy; <span id="year"></span>
					<a href="https://signedsignal.dev">SignedSignal</a>
					by
					<a href="https://github.com/rellek20122">Keller Dowell</a>
					· Licensed under
					<a href="https://creativecommons.org/licenses/by-nc-nd/4.0/"
						rel="license"
						target="_blank">
						CC BY-NC-ND 4.0
					</a>
				</span>

				<div class="license-icons">
					<img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC">
					<img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY">
					<img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="NC">
					<img src="https://mirrors.creativecommons.org/presskit/icons/nd.svg" alt="ND">
				</div>
			</div>
		</div>
	</footer>

	<script>
		document.querySelector("#year").textContent = new Date().getFullYear();
	</script>
</body>
</html>
